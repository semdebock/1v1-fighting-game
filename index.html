<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fight Arena v0.8</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#050812;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden}.app{max-width:1100px;min-height:100vh;margin:auto;padding:16px;background:radial-gradient(circle at 50% 20%,#28225d,#090d19 55%,#03050a)}button{color:#fff;background:#171d2b;border:1px solid #394258;border-radius:14px;padding:13px;font-weight:800;touch-action:manipulation}.primary{background:#526dff}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900}.currency{display:flex;gap:8px}.pill,.tag{padding:7px 10px;background:#111725;border:1px solid #30394c;border-radius:99px}.screen{display:none}.screen.active{display:block}.home{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;min-height:480px}.home h1{font-size:46px;line-height:.9;margin:12px 0}.buttons{display:grid;gap:9px}.fighter-preview{text-align:center;font-size:90px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.panel{background:#111725dd;border:1px solid #30394c;border-radius:18px;padding:15px}.card.active{outline:2px solid #526dff}.locked{opacity:.45}.sectionhead{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats div{background:#090e19;padding:10px;border-radius:10px}.stats small{display:block;color:#98a5ba}.arena{height:min(50vw,420px);min-height:300px;position:relative;overflow:hidden;border-radius:16px;border:1px solid #394258;background:linear-gradient(#111936,#090b14 70%)}.city{position:absolute;bottom:14%;width:100%;height:35%;background:repeating-linear-gradient(90deg,#10172b 0 8%,#202b48 8% 13%,#090f20 13% 20%)}.floor{position:absolute;bottom:0;width:100%;height:14%;background:#20232d;border-top:2px solid #515c75}.fighter{position:absolute;bottom:14%;width:74px;height:135px;transition:filter .1s}.player{left:12%}.enemy{left:80%}.body{position:absolute;left:18px;top:43px;width:39px;height:53px;border:4px solid #111;background:#3d4148}.head{position:absolute;left:20px;top:4px;width:36px;height:38px;border:4px solid #111;background:#aaa;border-radius:6px}.eye{position:absolute;top:15px;width:6px;height:5px;background:#111}.eye.l{left:6px}.eye.r{right:6px}.arm{position:absolute;top:48px;width:17px;height:50px;background:#777;border:4px solid #111}.arm.l{left:6px}.arm.r{right:6px}.leg{position:absolute;top:93px;width:22px;height:40px;background:#292d34;border:4px solid #111}.leg.l{left:16px}.leg.r{right:16px}.rookie .head{background:#f0b266}.rookie .body{background:#252a31}.rookie:after{content:'';position:absolute;left:16px;top:92px;width:45px;height:7px;background:#e63b32}.primo{transform:scale(1.12);transform-origin:bottom}.primo .head{background:#1762c5;border-radius:15px}.primo .body,.primo .arm{background:#ad6736}.primo .leg{background:#1757ad}.nightfang .head{background:#242039;border-radius:18px}.nightfang .body{background:#1a1925}.nightfang .eye{background:#a855f7;box-shadow:0 0 7px #a855f7}.ultron .head{background:#586473;clip-path:polygon(15% 0,85% 0,100% 25%,88% 100%,12% 100%,0 25%)}.ultron .head:after{content:'';position:absolute;left:4px;right:4px;top:13px;height:6px;background:#ff3838;box-shadow:0 0 8px #ff3838}.ultron .body,.ultron .arm{background:#424c5a}.ultron .body:after{content:'';position:absolute;left:10px;top:15px;width:11px;height:11px;border-radius:50%;background:#ff3838;box-shadow:0 0 8px #ff3838}.hpgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:12px 0}.bar{height:12px;background:#090c13;border:1px solid #30394c;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#526dff}.bar.enemybar i{background:#8b5cf6}.controls{display:grid;grid-template-columns:1fr 1.5fr;gap:18px;margin-top:12px;align-items:center}.stick{width:120px;height:120px;border-radius:50%;background:#111725;border:1px solid #394258;position:relative;touch-action:none}.knob{position:absolute;width:50px;height:50px;border-radius:50%;background:#526dff;left:34px;top:34px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.result{text-align:center;padding:70px 0}.result h1{font-size:48px}.pulse{position:absolute;width:32px;height:14px;border-radius:50%;background:#ff3838;box-shadow:0 0 15px #ff3838;z-index:10}.hit{filter:brightness(2)}.ko{transform:rotate(80deg);transform-origin:bottom;transition:.5s}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#526dff;padding:10px 16px;border-radius:99px;z-index:99}@media(max-width:700px){.home{grid-template-columns:1fr 1fr;min-height:400px}.home h1{font-size:34px}.controls{grid-template-columns:130px 1fr}.stick{width:105px;height:105px}.knob{left:29px;top:29px;width:45px;height:45px}.actions button{padding:11px 3px;font-size:11px}}
</style>
</head><body><main class="app">
<header class="top"><div><small>NEO CITY</small><div class="brand">FIGHT ARENA <span class="tag">v0.8</span></div></div><div class="currency"><span class="pill">LV <b id="lv">1</b></span><span class="pill">🪙 <b id="coins">1250</b></span><span class="pill">💎 <b id="gems">50</b></span></div></header>
<section id="home" class="screen active"><div class="home"><div><span class="tag">ULTRON UPDATE</span><h1>ENTER THE<br>ARENA</h1><p>Fight through the campaign, earn rewards and unlock new opponents.</p><div class="buttons"><button class="primary" id="play">⚔️ PLAY CAMPAIGN</button><button id="gallery">👥 CHARACTER GALLERY</button><button id="daily">🎁 DAILY REWARD</button></div></div><div><div class="fighter-preview" id="homeIcon">🥊</div><h2 id="selectedName" style="text-align:center">ROOKIE</h2></div></div></section>
<section id="chars" class="screen"><div class="sectionhead"><h2>CHARACTER GALLERY</h2><button class="back">← BACK</button></div><div class="cards" id="charCards"></div><div class="panel" style="margin-top:12px"><h2 id="charTitle"></h2><p id="charDesc"></p><div class="stats" id="charStats"></div><button class="primary" id="charAction" style="width:100%;margin-top:12px"></button></div></section>
<section id="levels" class="screen"><div class="sectionhead"><h2>CAMPAIGN</h2><button class="back">← BACK</button></div><div class="cards" id="levelCards"></div><div class="panel" style="margin-top:12px"><span class="tag" id="diff"></span><h2 id="levelTitle"></h2><p id="levelDesc"></p><div class="stats" id="levelStats"></div><button class="primary" id="start" style="width:100%;margin-top:12px">FIGHT</button></div></section>
<section id="fight" class="screen"><div class="sectionhead"><button id="quit">← QUIT</button><b id="timer">60</b><span class="tag" id="fightTag"></span></div><div class="hpgrid"><div><b id="pname"></b><div class="bar"><i id="php"></i></div></div><div style="text-align:right"><b id="ename"></b><div class="bar enemybar"><i id="ehp"></i></div></div></div><div class="arena" id="arena"><div class="city"></div><div class="floor"></div><div id="pF" class="fighter player"></div><div id="eF" class="fighter enemy"></div><div id="pulse" class="pulse hidden"></div></div><div style="display:flex;gap:8px;align-items:center;margin-top:8px"><span>⚡ <b id="spText">0%</b></span><div class="bar" style="flex:1"><i id="sp"></i></div></div><div class="controls"><div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><small>← MOVE →</small></div><div class="actions"><button id="punch">👊 PUNCH</button><button id="kick">🦵 KICK</button><button id="special">⚡ SPECIAL</button><button id="jump">↑ JUMP</button><button id="block">🛡 BLOCK</button><button disabled id="tagfighter"></button></div></div></section>
<section id="results" class="screen result"><small>MATCH RESULT</small><h1 id="resultTitle"></h1><p id="resultText"></p><div class="cards"><div class="panel">🪙 <b id="rCoins"></b></div><div class="panel">XP <b id="rXp"></b></div></div><h2 id="unlock"></h2><button class="primary" id="continue">CONTINUE</button><button id="menu">MAIN MENU</button></section>
<div id="toast" class="toast hidden"></div>
</main><script>
const chars={Rookie:{hp:100,power:55,speed:60,price:0,desc:'Balanced starter fighter.',punch:8,kick:13,special:25},'El Primo':{hp:140,power:82,speed:42,price:1000,desc:'Heavy tank fighter with strong close-range attacks.',punch:11,kick:16,special:34}};
const levels=[{n:1,name:'Nightfang',diff:'Easy',hp:100,dmg:1,coins:100,xp:25,desc:'Fast but predictable melee fighter.'},{n:2,name:'Ultron',diff:'Normal',hp:125,dmg:1.1,coins:175,xp:40,desc:'Armored combat android with smarter AI and a ranged Energy Pulse.'}];
let save=JSON.parse(localStorage.getItem('fightArenaV08')||'null')||{coins:1250,gems:50,lv:1,xp:0,selected:'Rookie',owned:{Rookie:true,'El Primo':false},unlocked:1,daily:false};let chosen=save.selected,chosenLevel=1,F=null,loop=null,tick=null;
const $=x=>document.getElementById(x),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function persist(){localStorage.setItem('fightArenaV08',JSON.stringify(save));hud()}function hud(){$('coins').textContent=save.coins;$('gems').textContent=save.gems;$('lv').textContent=save.lv;$('selectedName').textContent=save.selected.toUpperCase();$('homeIcon').textContent=save.selected==='El Primo'?'💪':'🥊'}function screen(s){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(s).classList.add('active')}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1300)}
function sprite(type){let cls=type==='El Primo'?'primo':type.toLowerCase();return `<div class="head"><i class="eye l"></i><i class="eye r"></i></div><div class="body"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div>`}function setSprite(el,type){el.className='fighter '+(el.id==='pF'?'player ':'enemy ')+(type==='El Primo'?'primo':type.toLowerCase());el.innerHTML=sprite(type)}
function renderChars(){let box=$('charCards');box.innerHTML='';Object.entries(chars).forEach(([name,c])=>{let b=document.createElement('button');b.className='card '+(chosen===name?'active ':'')+(!save.owned[name]?'locked':'');b.innerHTML=`<h3>${name}</h3><div style="font-size:50px">${name==='El Primo'?'💪':'🥊'}</div><small>${save.owned[name]?(save.selected===name?'✓ SELECTED':'OWNED'):'🪙 '+c.price}</small>`;b.onclick=()=>{chosen=name;renderChars();renderCharInfo()};box.appendChild(b)})}function renderCharInfo(){let c=chars[chosen];$('charTitle').textContent=chosen;$('charDesc').textContent=c.desc;$('charStats').innerHTML=`<div><small>HEALTH</small>${c.hp}</div><div><small>POWER</small>${c.power}</div><div><small>SPEED</small>${c.speed}</div><div><small>SPECIAL</small>${c.special}</div>`;$('charAction').textContent=!save.owned[chosen]?`BUY • ${c.price} 🪙`:save.selected===chosen?'SELECTED':'SELECT';$('charAction').disabled=save.selected===chosen}
function renderLevels(){let box=$('levelCards');box.innerHTML='';levels.forEach(l=>{let open=l.n<=save.unlocked,b=document.createElement('button');b.className='card '+(chosenLevel===l.n?'active ':'')+(!open?'locked':'');b.innerHTML=`<h3>LEVEL ${l.n}</h3><h2>${l.name}</h2><span>${l.diff}</span><br><small>${open?'🪙 '+l.coins+' • '+l.xp+' XP':'🔒 LOCKED'}</small>`;b.onclick=()=>{if(!open)return toast('Beat Level '+(l.n-1)+' first');chosenLevel=l.n;renderLevels();renderLevelInfo()};box.appendChild(b)})}function renderLevelInfo(){let l=levels[chosenLevel-1];$('diff').textContent=l.diff.toUpperCase();$('levelTitle').textContent=`LEVEL ${l.n} — ${l.name.toUpperCase()}`;$('levelDesc').textContent=l.desc;$('levelStats').innerHTML=`<div><small>HP</small>${l.hp}</div><div><small>DAMAGE</small>${Math.round(l.dmg*100)}%</div><div><small>REWARD</small>${l.coins} 🪙</div><div><small>XP</small>${l.xp}</div>`}
function draw(){if(!F)return;$('pF').style.left=F.px+'%';$('eF').style.left=F.ex+'%';$('pF').style.bottom=`calc(14% + ${F.jump}px)`;$('php').style.width=(F.ph/F.pm*100)+'%';$('ehp').style.width=(F.eh/F.em*100)+'%';$('sp').style.width=F.sp+'%';$('spText').textContent=Math.floor(F.sp)+'%';$('special').disabled=F.sp<100;$('timer').textContent=F.time}
function damageEnemy(n,push=2){if(!F||F.over)return;F.eh=clamp(F.eh-n,0,F.em);F.ex=clamp(F.ex+push,10,92);F.sp=clamp(F.sp+n*1.3,0,100);$('eF').classList.add('hit');setTimeout(()=>$('eF')?.classList.remove('hit'),120);if(F.eh<=0)finish(true);draw()}function attack(kind){if(!F||F.over)return;let c=chars[save.selected];if(Math.abs(F.ex-F.px)<15)damageEnemy(kind==='kick'?c.kick:c.punch,kind==='kick'?4:2)}function enemyHit(){if(!F||F.over)return;let d=Math.round(7*F.level.dmg);if(F.block)d=Math.max(2,Math.round(d*.28));F.ph=clamp(F.ph-d,0,F.pm);$('pF').classList.add('hit');setTimeout(()=>$('pF')?.classList.remove('hit'),120);if(F.ph<=0)finish(false);draw()}
function pulse(){if(!F||F.over||F.pulse)return;F.pulse=true;let p=$('pulse'),x=F.ex;p.classList.remove('hidden');p.style.top='48%';let i=setInterval(()=>{if(!F||F.over){clearInterval(i);p.classList.add('hidden');return}x-=2.5;p.style.left=x+'%';if(Math.abs(x-F.px)<5){clearInterval(i);p.classList.add('hidden');F.ph=clamp(F.ph-(F.block?3:11),0,F.pm);F.pulse=false;if(F.ph<=0)finish(false);draw()}else if(x<0){clearInterval(i);p.classList.add('hidden');F.pulse=false}},30)}
function startFight(){let l=levels[chosenLevel-1],c=chars[save.selected];F={level:l,pm:c.hp,ph:c.hp,em:l.hp,eh:l.hp,px:12,ex:80,move:0,sp:0,block:false,jump:0,jv:0,time:60,over:false,atk:.8,pulseCd:4,pulse:false,last:performance.now()};setSprite($('pF'),save.selected);setSprite($('eF'),l.name);$('pname').textContent=save.selected.toUpperCase();$('ename').textContent=l.name.toUpperCase();$('fightTag').textContent=l.diff.toUpperCase()+' • LEVEL '+l.n;$('tagfighter').textContent=save.selected.toUpperCase();screen('fight');draw();clearInterval(tick);tick=setInterval(()=>{if(F&&!F.over){F.time--;if(F.time<=0)finish(F.ph/F.pm>=F.eh/F.em);draw()}},1000);cancelAnimationFrame(loop);function frame(now){if(!F)return;let dt=Math.min((now-F.last)/1000,.035);F.last=now;if(!F.over){let speed=save.selected==='El Primo'?23:29;F.px=clamp(F.px+F.move*speed*dt,3,F.ex-7);let gap=F.ex-F.px;if(gap>15)F.ex-= (l.name==='Ultron'?8.2:9)*dt;else if(gap<9)F.ex+=6*dt;F.ex=clamp(F.ex,F.px+7,92);F.atk-=dt;if(F.atk<=0&&gap<14){enemyHit();F.atk=(l.name==='Ultron'?.78:.95)*(1+Math.random()*.4)}if(l.name==='Ultron'){F.pulseCd-=dt;if(F.pulseCd<=0&&gap>=13){pulse();F.pulseCd=6+Math.random()*4}}if(F.jump>0||F.jv>0){F.jv-=900*dt;F.jump+=F.jv*dt;if(F.jump<=0){F.jump=0;F.jv=0}}draw()}loop=requestAnimationFrame(frame)}loop=requestAnimationFrame(frame)}
function finish(win){if(!F||F.over)return;F.over=true;clearInterval(tick);let loser=win?$('eF'):$('pF');loser.classList.add('ko');setTimeout(()=>{let l=F.level,coins=win?l.coins:20,xp=win?l.xp:10,unlocked=false;save.coins+=coins;save.xp+=xp;if(save.xp>=100){save.xp-=100;save.lv++;save.coins+=150;save.gems+=5}if(win&&l.n===save.unlocked&&l.n<levels.length){save.unlocked++;unlocked=true}persist();$('resultTitle').textContent=win?'VICTORY':'DEFEAT';$('resultText').textContent=win?l.name+' defeated.':l.name+' wins this round.';$('rCoins').textContent='+'+coins;$('rXp').textContent='+'+xp;$('unlock').textContent=unlocked?'🔓 LEVEL 2 UNLOCKED — ULTRON!':'';screen('results')},600)}
$('play').onclick=()=>{chosenLevel=Math.min(save.unlocked,2);renderLevels();renderLevelInfo();screen('levels')};$('gallery').onclick=()=>{chosen=save.selected;renderChars();renderCharInfo();screen('chars')};document.querySelectorAll('.back').forEach(b=>b.onclick=()=>screen('home'));$('start').onclick=startFight;$('quit').onclick=()=>{F=null;clearInterval(tick);cancelAnimationFrame(loop);screen('home')};$('punch').onpointerdown=()=>attack('punch');$('kick').onpointerdown=()=>attack('kick');$('special').onpointerdown=()=>{if(!F||F.sp<100)return;let c=chars[save.selected];F.sp=0;if(Math.abs(F.ex-F.px)<24)damageEnemy(c.special,8);draw()};$('jump').onpointerdown=()=>{if(F&&F.jump===0)F.jv=save.selected==='El Primo'?350:390};$('block').onpointerdown=()=>{if(F)F.block=true};['pointerup','pointercancel','pointerleave'].forEach(e=>$('block').addEventListener(e,()=>{if(F)F.block=false}));$('daily').onclick=()=>{if(save.daily)return toast('Daily reward already claimed');save.daily=true;save.coins+=250;persist();toast('+250 coins 🪙')};$('charAction').onclick=()=>{let c=chars[chosen];if(!save.owned[chosen]){if(save.coins<c.price)return toast('Not enough coins');save.coins-=c.price;save.owned[chosen]=true}save.selected=chosen;persist();renderChars();renderCharInfo();toast(chosen.toUpperCase()+' SELECTED')};$('continue').onclick=()=>{chosenLevel=Math.min(save.unlocked,2);renderLevels();renderLevelInfo();screen('levels')};$('menu').onclick=()=>screen('home');
let sid=null;function smove(e){if(!F)return;let r=$('stick').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),max=r.width*.28,n=clamp(dx/max,-1,1);F.move=Math.abs(n)>.12?n:0;$('knob').style.transform=`translateX(${n*max}px)`}$('stick').onpointerdown=e=>{sid=e.pointerId;$('stick').setPointerCapture(e.pointerId);smove(e)};$('stick').onpointermove=e=>{if(e.pointerId===sid)smove(e)};function sup(e){if(e.pointerId!==sid)return;sid=null;if(F)F.move=0;$('knob').style.transform='translateX(0)'}$('stick').onpointerup=sup;$('stick').onpointercancel=sup;hud();renderChars();renderCharInfo();
</script></body></html>
