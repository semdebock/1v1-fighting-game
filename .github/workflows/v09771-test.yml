name: Validate v0.9.7.7.1 Hero Revamp
on:
  push:
    branches: [release/v0.9.7.7.1-hero-revamp]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and build
        run: |
          node --check build/v09771/transform-v09771.js
          node --check build/v09771/patch-index-v09771.js
          node --check build/v09771/release-check-v09771.js
          node --check build/v0958/build-core-v0958.js
          node --check app/core/bootstrap-v096.js
          node --check update-v09771.js
          node build/v0958/build-core-v0958.js
          node --check app/core/core-runtime-v0958.js
          node build/v09771/patch-index-v09771.js
          node build/v09771/release-check-v09771.js
      - name: Persist isolated artifacts
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- index.html app/core/core-runtime-v0958.js app/core/core-runtime-v0958.meta.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html app/core/core-runtime-v0958.js app/core/core-runtime-v0958.meta.json
            git commit -m "Build v0.9.7.7.1 hero revamp test artifacts [skip ci]"
            git push origin HEAD:release/v0.9.7.7.1-hero-revamp
          fi
