name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.5.5 Smoke and Chaos
        run: |
          node --check build/v094/transform-v094.js
          node --check build/v0941/transform-v0941.js
          node --check build/v095/transform-v095.js
          node --check build/v0951/transform-v0951.js
          node --check build/v0952/transform-v0952.js
          node --check build/v0953/transform-v0953.js
          node --check build/v09531/transform-v09531.js
          node --check build/v0954/transform-v0954.js
          node --check build/v0955/transform-v0955.js
          node --check build/v0955/build-check-v0955.js
          node --check build/v0955/campaign-check-v0955.js
          node --check build/v0955/patch-index-v0955.js
          node --check core-v0955.js
          node --check campaign-v0955.js
          node --check qa-v0955.js
          node --check device-v092.js
          node --check touch-v0941.js
          node --check stability-v0941.js
          node build/v0955/build-check-v0955.js
          node --check /tmp/core-v0955-built.js
          node build/v0955/campaign-check-v0955.js
          node build/v0955/patch-index-v0955.js
          test -s index.html
          test -s campaign-v095.css
          test -s neo-v0951.css
          test -s street-v0952.css
          test -s vigilante-v0953.css
          test -s results-v09531.css
          test -s sinister-v0954.css
          test -s smoke-v0955.css
          test -s collection-v0941.css
          test -s touch-v0941.css
          grep -q "Fight Arena v0.9.5.5 — Smoke & Chaos" index.html
          grep -q "PHASE 2 • SMOKE & CHAOS" index.html
          grep -q "smoke-v0955.css" index.html
          grep -q "campaign-v0955.js" index.html
          grep -q "core-v0955.js" index.html
          grep -q "transform-v0955.js" index.html
          grep -q 'id="trainingSpecial"' index.html
          grep -q 'id="rematch"' index.html
          grep -q 'id="continue">NEXT FIGHT' index.html
          grep -q "version:'0.9.5.5'" /tmp/core-v0955-built.js
          grep -q "name:'Mysterio'" /tmp/core-v0955-built.js
          grep -q "name:'Green Goblin'" /tmp/core-v0955-built.js
          grep -q "hp:205,dmg:1.30,coins:900,xp:180" /tmp/core-v0955-built.js
          grep -q "hp:220,dmg:1.34,coins:1000,xp:195" /tmp/core-v0955-built.js
          grep -q "NOTHING HERE IS REAL" /tmp/core-v0955-built.js
          grep -q "CHAOS FROM ABOVE" /tmp/core-v0955-built.js
          grep -q "ILLUSION CLONE" /tmp/core-v0955-built.js
          grep -q "SMOKE TELEPORT" /tmp/core-v0955-built.js
          grep -q "PUMPKIN BOMB" /tmp/core-v0955-built.js
          grep -q "fillTrainingSpecial" /tmp/core-v0955-built.js
          grep -q "SPECIAL + KINETIC READY" /tmp/core-v0955-built.js
          grep -q "F.kinetic=100" /tmp/core-v0955-built.js
          grep -q "F.ph=F.pm" /tmp/core-v0955-built.js
          grep -q "F.cooldowns=\[0,0,0\]" /tmp/core-v0955-built.js
          grep -q "punisherUnlockShown" /tmp/core-v0955-built.js
          grep -q "showPunisherUnlock" /tmp/core-v0955-built.js
          grep -q "rematch(){" /tmp/core-v0955-built.js
          grep -q "next(){" /tmp/core-v0955-built.js
          grep -q "screen('results')" /tmp/core-v0955-built.js
          grep -q "clearFightTouchLock" /tmp/core-v0955-built.js
          grep -q "name:'Rhino'" /tmp/core-v0955-built.js
          grep -q "name:'Electro'" /tmp/core-v0955-built.js
          grep -q "name:'Ultron'" /tmp/core-v0955-built.js
          grep -q "name:'Prowler'" /tmp/core-v0955-built.js
          grep -q "code==='DIAMONDS'" /tmp/core-v0955-built.js
          grep -q "phase2Order=\['Rhino','Electro','Mysterio','Green Goblin'\]" campaign-v0955.js
          grep -q "smokeChaosComplete" campaign-v0955.js
          grep -q "FightArenaCampaignV0955" campaign-v0955.js
          grep -q "name:'Doctor Octopus'.*boss:true" campaign-v0954.js
          grep -q "STANDBY=\['Ultron','Prowler'\]" campaign-v0954.js
          grep -q "#results.active" results-v09531.css
          grep -q "fighter-unlock-reveal" results-v09531.css
          grep -q "touchstart" touch-v0941.js
          grep -q "preventDefault" touch-v0941.js
          grep -q "multiTouch:true" touch-v0941.js
          grep -q "device-iphone" device-v092.css
          grep -q "KeyA" device-v092.js

      - name: Persist v0.9.5.5 release index
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Release Fight Arena v0.9.5.5 index [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
