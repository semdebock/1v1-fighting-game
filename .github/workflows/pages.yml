name: Deploy Multiverse Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.7.4 Hulkbuster Premium Variant
        run: |
          node --check build/v0974/transform-v0974.js
          node --check build/v0974/release-check-v0974.js
          node --check build/v0973/release-check-v0973.js
          node --check build/v0958/build-core-v0958.js
          node --check build/v096/final-check-v096.js
          node --check build/v096/patch-index-v096.js
          node --check app/core/bootstrap-v096.js
          node --check update-v0973.js
          node --check update-v0974.js

          node build/v0957/build-check-v0957.js
          node build/v0957/campaign-check-v0957.js
          node build/v095722/stability-check-v095722.js
          node build/v0958/build-core-v0958.js
          node --check app/core/core-runtime-v0958.js
          node build/v0958/cleanup-check-v0958.js
          node build/v096/presentation-check-v096.js
          node build/v096/final-check-v096.js
          node build/v0964/release-check-v0964.js
          node build/v0966/release-check-v0966.js
          node build/v097/release-check-v097.js
          node build/v0971/release-check-v0971.js
          node build/v0972/release-check-v0972.js
          node build/v0973/release-check-v0973.js
          node build/v0974/release-check-v0974.js
          node build/v096/patch-index-v096.js
          node build/v096/patch-index-v096.js

          grep -q "Multiverse Arena v0.9.7.4 — Hulkbuster Premium Variant" index.html
          grep -q "MYTHIC ARMOR • HULKBUSTER" index.html
          grep -q "BUILT TO<br>BREAK GIANTS." index.html
          grep -q "app/core/bootstrap-v096.js?v=0974" index.html
          grep -q "const BUILD='0.9.7.4'" app/core/bootstrap-v096.js
          grep -q "const ASSET='0974'" app/core/bootstrap-v096.js
          grep -q "const SAVE_KEY='fightArenaV08'" app/core/bootstrap-v096.js
          grep -q "update-v0973.js" app/core/bootstrap-v096.js
          grep -q "update-v0974.js" app/core/bootstrap-v096.js

          grep -q "id:'iron-hulkbuster'" app/core/core-runtime-v0958.js
          grep -q "rarity:'MYTHIC',price:250" app/core/core-runtime-v0958.js
          grep -q "hp:175,power:98,speed:48,punch:16,kick:23,special:68" app/core/core-runtime-v0958.js
          grep -q "HEAVY ARMOR • 18% DAMAGE REDUCTION" app/core/core-runtime-v0958.js
          grep -q "Math.round(n\*.82)" app/core/core-runtime-v0958.js
          grep -q "HULKBUSTER SLAM" app/core/core-runtime-v0958.js
          grep -q "MICRO MISSILE SWARM" app/core/core-runtime-v0958.js
          grep -q "REPULSOR BARRAGE" app/core/core-runtime-v0958.js
          grep -q "VERONICA CRASHDOWN!" app/core/core-runtime-v0958.js
          grep -q "activeStats:name=>activeFighterStats(name)" app/core/core-runtime-v0958.js

          grep -q "DAILY_REWARD_COINS=1250" app/core/core-runtime-v0958.js
          grep -q "DAILY_COOLDOWN_MS=24\*60\*60\*1000" app/core/core-runtime-v0958.js
          grep -q "FightArenaDailyControls" app/core/core-runtime-v0958.js
          grep -q "mystiqueTransform" app/core/core-runtime-v0958.js
          grep -q "deadpoolLastStand" app/core/core-runtime-v0958.js
          grep -q "magnetoMaster" app/core/core-runtime-v0958.js
          grep -q "primo-super-leap" app/core/core-runtime-v0958.js
          grep -q "name:'Doctor Octopus'" app/core/core-runtime-v0958.js
          grep -q "FightArenaTrainingControls" app/core/core-runtime-v0958.js
          grep -q "punisherUnlockShown" app/core/core-runtime-v0958.js
          grep -q "multiTouch:true" touch-v0941.js

          grep -q "const ownsRelease=" update-v0973.js
          grep -q "BUY & EQUIP • 250 💎" update-v0974.js
          grep -q ".fighter.ironman.skin-iron-hulkbuster" update-v0974.css
          grep -q "veronica-crashfx" update-v0974.css
          ! grep -q "\.fight \.fighter\.player\.skin-iron-hulkbuster{transform" update-v0974.css
          ! grep -q "new MutationObserver" update-v0974.js
          ! grep -q "requestAnimationFrame(loop)" update-v0974.js
          ! grep -q "setInterval(" update-v0974.js
          ! grep -q "localStorage.removeItem('fightArenaV08')" build/v0974/transform-v0974.js

      - name: Persist v0.9.7.4 release artifacts
        run: |
          if [ -n "$(git status --porcelain -- index.html app/core/core-runtime-v0958.js app/core/core-runtime-v0958.meta.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html app/core/core-runtime-v0958.js app/core/core-runtime-v0958.meta.json
            git commit -m "Release Multiverse Arena v0.9.7.4 Hulkbuster Premium Variant [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
