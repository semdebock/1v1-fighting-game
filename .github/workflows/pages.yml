name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.1 static release
        run: |
          cat build/v091/core-v091-part1.txt build/v091/core-v091-part2.txt build/v091/core-v091-part3.txt build/v091/core-v091-part4.txt > /tmp/core-v091-full.js
          node --check /tmp/core-v091-full.js
          node --check core-v091.js
          node --check qa-v091.js
          test -s index.html
          test -s core-v091.js
          test -s build/v090/cosmetics-v090.css
          grep -q "v0.9.1" index.html
          grep -q "Daredevil" /tmp/core-v091-full.js
          grep -q "Moon Knight" /tmp/core-v091-full.js
          grep -q "spider-symbiote" /tmp/core-v091-full.js
          grep -q "bindClick('gallery'" /tmp/core-v091-full.js
          grep -q "bindClick('start'" /tmp/core-v091-full.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
