name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.5 Campaign Phases Foundation
        run: |
          node --check build/v094/transform-v094.js
          node --check build/v0941/transform-v0941.js
          node --check build/v095/transform-v095.js
          node --check build/v095/build-check-v095.js
          node --check core-v095.js
          node --check device-v092.js
          node --check touch-v0941.js
          node --check stability-v0941.js
          node --check campaign-v095.js
          node --check qa-v095.js
          node build/v095/build-check-v095.js
          node --check /tmp/core-v095-built.js
          test -s index.html
          test -s campaign-v095.css
          test -s collection-v0941.css
          test -s touch-v0941.css
          grep -q "v0.9.5" index.html
          grep -q "CAMPAIGN REBORN" index.html
          grep -q "campaign-v095.css" index.html
          grep -q "campaign-v095.js" index.html
          grep -q "core-v095.js" index.html
          grep -q "version:'0.9.5'" /tmp/core-v095-built.js
          grep -q "cleanupArenaTransient" /tmp/core-v095-built.js
          grep -q "skin-hero-group" /tmp/core-v095-built.js
          grep -q "code==='DIAMONDS'" /tmp/core-v095-built.js
          grep -q "name:'Ultron'" /tmp/core-v095-built.js
          grep -q "name:'Prowler'" /tmp/core-v095-built.js
          grep -q "STANDBY=\['Ultron','Prowler'\]" campaign-v095.js
          grep -q "title:'NEO CITY ARENA'" campaign-v095.js
          grep -q "title:'STREET CRIMINALS'" campaign-v095.js
          grep -q "title:'SINISTER THREAT'" campaign-v095.js
          grep -q "name:'Punisher'.*PLAYABLE FIGHTER UNLOCK" campaign-v095.js
          grep -q "name:'Doctor Octopus'.*boss:true" campaign-v095.js
          grep -q "campaign-phase" campaign-v095.css
          grep -q "phase-section" campaign-v095.css
          grep -q "touchstart" touch-v0941.js
          grep -q "preventDefault" touch-v0941.js
          grep -q "multiTouch:true" touch-v0941.js
          grep -q "device-iphone" device-v092.css
          grep -q "KeyA" device-v092.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
