name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.5.4 Raw Power
        run: |
          set +e
          (
            set -e
            node --check build/v094/transform-v094.js
            node --check build/v0941/transform-v0941.js
            node --check build/v095/transform-v095.js
            node --check build/v0951/transform-v0951.js
            node --check build/v0952/transform-v0952.js
            node --check build/v0953/transform-v0953.js
            node --check build/v09531/transform-v09531.js
            node --check build/v0954/transform-v0954.js
            node --check build/v0954/build-check-v0954.js
            node --check build/v0954/patch-index-v0954.js
            node --check core-v0954.js
            node --check device-v092.js
            node --check touch-v0941.js
            node --check stability-v0941.js
            node --check campaign-v0954.js
            node --check qa-v0954.js
            node build/v0954/build-check-v0954.js
            node --check /tmp/core-v0954-built.js
            node build/v0954/patch-index-v0954.js
            test -s index.html
            test -s campaign-v095.css
            test -s neo-v0951.css
            test -s street-v0952.css
            test -s vigilante-v0953.css
            test -s results-v09531.css
            test -s sinister-v0954.css
            test -s collection-v0941.css
            test -s touch-v0941.css
            grep -q "Fight Arena v0.9.5.4 — Raw Power" index.html
            grep -q "PHASE 2 • RAW POWER" index.html
            grep -q "sinister-v0954.css" index.html
            grep -q "campaign-v0954.js" index.html
            grep -q "core-v0954.js" index.html
            grep -q "transform-v0954.js" index.html
            grep -q 'id="rematch"' index.html
            grep -q 'id="continue">NEXT FIGHT' index.html
            grep -q "version:'0.9.5.4'" /tmp/core-v0954-built.js
            grep -q "name:'Rhino'" /tmp/core-v0954-built.js
            grep -q "name:'Electro'" /tmp/core-v0954-built.js
            grep -q "SINISTER_INTROS" /tmp/core-v0954-built.js
            grep -q "rhinoCharge" /tmp/core-v0954-built.js
            grep -q "rhinoHorn" /tmp/core-v0954-built.js
            grep -q "rhinoQuake" /tmp/core-v0954-built.js
            grep -q "rhinoStampede" /tmp/core-v0954-built.js
            grep -q "electroArc" /tmp/core-v0954-built.js
            grep -q "electroBlink" /tmp/core-v0954-built.js
            grep -q "electroChain" /tmp/core-v0954-built.js
            grep -q "electroGrid" /tmp/core-v0954-built.js
            grep -q "electroOvercharge" /tmp/core-v0954-built.js
            grep -q "RESULT_CAMPAIGN_ORDER" /tmp/core-v0954-built.js
            grep -q "punisherUnlockShown" /tmp/core-v0954-built.js
            grep -q "showPunisherUnlock" /tmp/core-v0954-built.js
            grep -q "screen('results')" /tmp/core-v0954-built.js
            grep -q "clearFightTouchLock" /tmp/core-v0954-built.js
            grep -q "rematch(){" /tmp/core-v0954-built.js
            grep -q "next(){" /tmp/core-v0954-built.js
            grep -q "introLocked" /tmp/core-v0954-built.js
            grep -q "name:'Punisher'" /tmp/core-v0954-built.js
            grep -q "name:'Taskmaster'" /tmp/core-v0954-built.js
            grep -q "name:'Crossbones'" /tmp/core-v0954-built.js
            grep -q "name:'Bullseye'" /tmp/core-v0954-built.js
            grep -q "name:'Kingpin'" /tmp/core-v0954-built.js
            grep -q "name:'Mysterio'" /tmp/core-v0954-built.js
            grep -q "name:'Green Goblin'" /tmp/core-v0954-built.js
            grep -q "name:'Ultron'" /tmp/core-v0954-built.js
            grep -q "name:'Prowler'" /tmp/core-v0954-built.js
            grep -q "code==='DIAMONDS'" /tmp/core-v0954-built.js
            grep -q "fighter.rhino" sinister-v0954.css
            grep -q "fighter.electro" sinister-v0954.css
            grep -q "electro-target" sinister-v0954.css
            grep -q "rhino-stampedefx" sinister-v0954.css
            grep -q "phase2Order=\['Rhino','Electro'\]" campaign-v0954.js
            grep -q "name:'Rhino'.*built:true" campaign-v0954.js
            grep -q "name:'Electro'.*built:true" campaign-v0954.js
            grep -q "name:'Mysterio'.*assigned:true" campaign-v0954.js
            grep -q "name:'Green Goblin'.*assigned:true" campaign-v0954.js
            grep -q "name:'Doctor Octopus'.*boss:true" campaign-v0954.js
            grep -q "STANDBY=\['Ultron','Prowler'\]" campaign-v0954.js
            grep -q "#results.active" results-v09531.css
            grep -q "fighter-unlock-reveal" results-v09531.css
            grep -q "touchstart" touch-v0941.js
            grep -q "preventDefault" touch-v0941.js
            grep -q "multiTouch:true" touch-v0941.js
            grep -q "device-iphone" device-v092.css
            grep -q "KeyA" device-v092.js
          ) > /tmp/v0954-validation.log 2>&1
          status=$?
          cat /tmp/v0954-validation.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/v0954-validation.log build/v0954/last-validation.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add build/v0954/last-validation.log
            git commit -m "Record v0.9.5.4 validation failure [skip ci]" || true
            git push || true
            exit "$status"
          fi

      - name: Persist v0.9.5.4 release index
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Release Fight Arena v0.9.5.4 index [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
