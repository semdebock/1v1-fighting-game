name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.3.1 DIAMONDS redeem patch
        run: |
          cat build/v093/core-v093-part1.txt build/v093/core-v093-part2.txt build/v093/core-v093-part3.txt build/v093/core-v093-part4.txt > /tmp/core-v093-full.js
          node --check /tmp/core-v093-full.js
          node --check core-v0931.js
          node --check device-v092.js
          node --check qa-v0931.js
          test -s index.html
          test -s balance-v093.css
          test -s core-v0931.js
          test -s qa-v0931.js
          grep -q "v0.9.3.1" index.html
          grep -q "New code: DIAMONDS" index.html
          grep -q "code==='DIAMONDS'" core-v0931.js
          grep -q "save.gems+=100" core-v0931.js
          grep -q "redeemedDiamonds" core-v0931.js
          grep -q "price:100.*skin-iron-nano" /tmp/core-v093-full.js
          grep -q "NANOTECH ARSENAL" /tmp/core-v093-full.js
          grep -q "device-iphone" device-v092.css
          grep -q "KeyA" device-v092.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
