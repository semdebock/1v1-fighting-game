name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.5.1 Neo City Arena Expansion
        run: |
          node --check build/v094/transform-v094.js
          node --check build/v0941/transform-v0941.js
          node --check build/v095/transform-v095.js
          node --check build/v0951/transform-v0951.js
          node --check build/v0951/build-check-v0951.js
          node --check core-v0951.js
          node --check device-v092.js
          node --check touch-v0941.js
          node --check stability-v0941.js
          node --check campaign-v0951.js
          node --check qa-v0951.js
          node build/v0951/build-check-v0951.js
          node --check /tmp/core-v0951-built.js
          test -s index.html
          test -s campaign-v095.css
          test -s neo-v0951.css
          test -s collection-v0941.css
          test -s touch-v0941.css
          grep -q "v0.9.5.1" index.html
          grep -q "NEO CITY ARENA EXPANSION" index.html
          grep -q "neo-v0951.css" index.html
          grep -q "campaign-v0951.js" index.html
          grep -q "core-v0951.js" index.html
          grep -q "version:'0.9.5.1'" /tmp/core-v0951-built.js
          grep -q "name:'Voltage'" /tmp/core-v0951-built.js
          grep -q "name:'Razor'" /tmp/core-v0951-built.js
          grep -q "name:'Titan'" /tmp/core-v0951-built.js
          grep -q "name:'Arena Champion'" /tmp/core-v0951-built.js
          grep -q "NEO_INTROS" /tmp/core-v0951-built.js
          grep -q "voltageShot" /tmp/core-v0951-built.js
          grep -q "razorTwin" /tmp/core-v0951-built.js
          grep -q "titanGround" /tmp/core-v0951-built.js
          grep -q "championCrown" /tmp/core-v0951-built.js
          grep -q "FightArenaCampaignControls" /tmp/core-v0951-built.js
          grep -q "campaignWins" /tmp/core-v0951-built.js
          grep -q "campaignPhaseRewards" /tmp/core-v0951-built.js
          grep -q "name:'Ultron'" /tmp/core-v0951-built.js
          grep -q "name:'Prowler'" /tmp/core-v0951-built.js
          grep -q "code==='DIAMONDS'" /tmp/core-v0951-built.js
          grep -q "fighter.voltage" neo-v0951.css
          grep -q "fighter.razor" neo-v0951.css
          grep -q "fighter.titan" neo-v0951.css
          grep -q "fighter.arenachampion" neo-v0951.css
          grep -q "champion-mode" neo-v0951.css
          grep -q "prologueOrder" campaign-v0951.js
          grep -q "name:'Punisher'.*PLAYABLE FIGHTER UNLOCK" campaign-v0951.js
          grep -q "name:'Doctor Octopus'.*boss:true" campaign-v0951.js
          grep -q "STANDBY=\['Ultron','Prowler'\]" campaign-v0951.js
          grep -q "touchstart" touch-v0941.js
          grep -q "preventDefault" touch-v0941.js
          grep -q "multiTouch:true" touch-v0941.js
          grep -q "device-iphone" device-v092.css
          grep -q "KeyA" device-v092.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
