name: Deploy Multiverse Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.5.7.2.2 Fight Stability Hotfix
        run: |
          node --check build/v094/transform-v094.js
          node --check build/v0941/transform-v0941.js
          node --check build/v095/transform-v095.js
          node --check build/v0951/transform-v0951.js
          node --check build/v0952/transform-v0952.js
          node --check build/v0953/transform-v0953.js
          node --check build/v09531/transform-v09531.js
          node --check build/v0954/transform-v0954.js
          node --check build/v0955/transform-v0955.js
          node --check build/v0956/transform-v0956.js
          node --check build/v0957/transform-v0957.js
          node --check build/v0957/build-check-v0957.js
          node --check build/v0957/campaign-check-v0957.js
          node --check build/v095722/stability-check-v095722.js
          node --check build/v095722/patch-index-v095722.js
          node --check core-v0957.js
          node --check campaign-v0957.js
          node --check ui-v09571.js
          node --check polish-v09572.js
          node --check qa-v095722.js
          node --check device-v092.js
          node --check touch-v0941.js
          node --check stability-v0941.js
          node build/v0957/build-check-v0957.js
          node --check /tmp/core-v0957-built.js
          node build/v0957/campaign-check-v0957.js
          node build/v095722/stability-check-v095722.js
          node build/v095722/patch-index-v095722.js
          test -s index.html
          test -s polish-v09572.js
          test -s polish-v09572.css
          test -s stability-v095722.css
          test -s qa-v095722.js
          grep -q "Multiverse Arena v0.9.5.7.2.2 — Fight Stability Hotfix" index.html
          grep -q "polish-v09572.js?v=095722" index.html
          grep -q "stability-v095722.css?v=095722" index.html
          grep -q "qa-v095722.js?v=095722" index.html
          grep -q "VILLAIN GAUNTLET" index.html
          grep -q "const BUILD='0.9.5.7.2.2'" polish-v09572.js
          grep -q "setInterval(tick,150)" polish-v09572.js
          ! grep -q "new MutationObserver" polish-v09572.js
          ! grep -q "requestAnimationFrame(loop)" polish-v09572.js
          ! grep -q "classList.add('impact-pop')" polish-v09572.js
          grep -q ".fighter.hurt" stability-v095722.css
          grep -q "version:'0.9.5.7'" /tmp/core-v0957-built.js
          grep -q "name:'Doctor Octopus'" /tmp/core-v0957-built.js
          grep -q "screen('results')" /tmp/core-v0957-built.js
          grep -q "phase2Order=\['Rhino','Electro','Mysterio','Green Goblin','Doctor Octopus'\]" campaign-v0957.js
          grep -q "touchstart" touch-v0941.js
          grep -q "multiTouch:true" touch-v0941.js

      - name: Persist v0.9.5.7.2.2 stability index
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Release Multiverse Arena v0.9.5.7.2.2 stability index [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
