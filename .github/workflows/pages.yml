name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.5.2 Street War
        run: |
          node --check build/v094/transform-v094.js
          node --check build/v0941/transform-v0941.js
          node --check build/v095/transform-v095.js
          node --check build/v0951/transform-v0951.js
          node --check build/v0952/transform-v0952.js
          node --check build/v0952/build-check-v0952.js
          node --check build/v0952/patch-index-v0952.js
          node --check core-v0952.js
          node --check device-v092.js
          node --check touch-v0941.js
          node --check stability-v0941.js
          node --check campaign-v0952.js
          node --check qa-v0952.js
          node build/v0952/build-check-v0952.js
          node --check /tmp/core-v0952-built.js
          node build/v0952/patch-index-v0952.js
          test -s index.html
          test -s campaign-v095.css
          test -s neo-v0951.css
          test -s street-v0952.css
          test -s collection-v0941.css
          test -s touch-v0941.css
          grep -q "v0.9.5.2" index.html
          grep -q "PHASE 1 • STREET WAR" index.html
          grep -q "street-v0952.css" index.html
          grep -q "campaign-v0952.js" index.html
          grep -q "core-v0952.js" index.html
          grep -q "transform-v0952.js" index.html
          grep -q "version:'0.9.5.2'" /tmp/core-v0952-built.js
          grep -q "name:'Crossbones'" /tmp/core-v0952-built.js
          grep -q "name:'Bullseye'" /tmp/core-v0952-built.js
          grep -q "STREET_INTROS" /tmp/core-v0952-built.js
          grep -q "crossbonesBreaker" /tmp/core-v0952-built.js
          grep -q "crossbonesBurst" /tmp/core-v0952-built.js
          grep -q "crossbonesBlade" /tmp/core-v0952-built.js
          grep -q "crossbonesWar" /tmp/core-v0952-built.js
          grep -q "bullseyeThrow" /tmp/core-v0952-built.js
          grep -q "bullseyeRicochet" /tmp/core-v0952-built.js
          grep -q "bullseyeStep" /tmp/core-v0952-built.js
          grep -q "bullseyePerfect" /tmp/core-v0952-built.js
          grep -q "FightArenaCampaignControls" /tmp/core-v0952-built.js
          grep -q "campaignWins" /tmp/core-v0952-built.js
          grep -q "name:'Voltage'" /tmp/core-v0952-built.js
          grep -q "name:'Arena Champion'" /tmp/core-v0952-built.js
          grep -q "name:'Ultron'" /tmp/core-v0952-built.js
          grep -q "name:'Prowler'" /tmp/core-v0952-built.js
          grep -q "code==='DIAMONDS'" /tmp/core-v0952-built.js
          grep -q "fighter.crossbones" street-v0952.css
          grep -q "fighter.bullseye" street-v0952.css
          grep -q "bullseye-perfectfx" street-v0952.css
          grep -q "crossbones-warfx" street-v0952.css
          grep -q "streetOrder" campaign-v0952.js
          grep -q "name:'Crossbones'.*built:true" campaign-v0952.js
          grep -q "name:'Bullseye'.*built:true" campaign-v0952.js
          grep -q "name:'Punisher'.*PLAYABLE FIGHTER UNLOCK" campaign-v0952.js
          grep -q "name:'Doctor Octopus'.*boss:true" campaign-v0952.js
          grep -q "STANDBY=\['Ultron','Prowler'\]" campaign-v0952.js
          grep -q "touchstart" touch-v0941.js
          grep -q "preventDefault" touch-v0941.js
          grep -q "multiTouch:true" touch-v0941.js
          grep -q "device-iphone" device-v092.css
          grep -q "KeyA" device-v092.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
