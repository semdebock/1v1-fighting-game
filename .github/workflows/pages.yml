name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.4 Wakanda & Weapon X release
        run: |
          node --check build/v094/transform-v094.js
          node --check build/v094/build-check-v094.js
          node --check core-v094.js
          node --check device-v092.js
          node --check touch-v0932.js
          node --check qa-v094.js
          node build/v094/build-check-v094.js
          node --check /tmp/core-v094-built.js
          test -s index.html
          test -s heroes-v094.css
          test -s touch-v0932.css
          grep -q "v0.9.4" index.html
          grep -q "WAKANDA & WEAPON X" index.html
          grep -q "trainingHeroStat" index.html
          grep -q "core-v094.js" index.html
          grep -q "Black Panther" /tmp/core-v094-built.js
          grep -q "Wolverine" /tmp/core-v094-built.js
          grep -q "price:3200" /tmp/core-v094-built.js
          grep -q "price:4000" /tmp/core-v094-built.js
          grep -q "id:'bp-kinetic'.*price:80" /tmp/core-v094-built.js
          grep -q "KINETIC CLAW WAVE" /tmp/core-v094-built.js
          grep -q "PERFECT ABSORB" /tmp/core-v094-built.js
          grep -q "ADAMANTIUM SLASH" /tmp/core-v094-built.js
          grep -q "HEALING SURGE" /tmp/core-v094-built.js
          grep -q "BERSERKER RAGE" /tmp/core-v094-built.js
          grep -q "code==='DIAMONDS'" /tmp/core-v094-built.js
          grep -q "save.gems+=100" /tmp/core-v094-built.js
          grep -q "skin-bp-kinetic" heroes-v094.css
          grep -q "wolverine" heroes-v094.css
          grep -q "gesturestart" touch-v0932.js
          grep -q "device-iphone" device-v092.css
          grep -q "KeyA" device-v092.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
