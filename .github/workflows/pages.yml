name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and validate v0.9.0
        run: |
          cat build/v090/core_transform_part1.txt build/v090/core_transform_part2.txt build/v090/core_transform_part3.txt build/v090/core_transform_part4.txt > /tmp/core_transform_v090.py
          python /tmp/core_transform_v090.py
          cp build/v090/index_part1.txt index.html
          cp build/v090/cosmetics-v090.css cosmetics-v090.css
          cp build/v090/qa-v090.js qa-v090.js
          node --check core-v090.js
          test -s index.html
          test -s core-v090.js
          test -s cosmetics-v090.css
          test -s qa-v090.js
          grep -q "v0.9.0" index.html
          grep -q "Daredevil" core-v090.js
          grep -q "Moon Knight" core-v090.js
          grep -q "spider-symbiote" core-v090.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
