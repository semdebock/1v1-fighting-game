name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.5.6 Goblin Rework and Training Lab
        run: |
          node --check build/v094/transform-v094.js
          node --check build/v0941/transform-v0941.js
          node --check build/v095/transform-v095.js
          node --check build/v0951/transform-v0951.js
          node --check build/v0952/transform-v0952.js
          node --check build/v0953/transform-v0953.js
          node --check build/v09531/transform-v09531.js
          node --check build/v0954/transform-v0954.js
          node --check build/v0955/transform-v0955.js
          node --check build/v0956/transform-v0956.js
          node --check build/v0956/build-check-v0956.js
          node --check build/v0956/campaign-check-v0956.js
          node --check build/v0956/patch-index-v0956.js
          node --check core-v0956.js
          node --check campaign-v0956.js
          node --check qa-v0956.js
          node --check device-v092.js
          node --check touch-v0941.js
          node --check stability-v0941.js
          node build/v0956/build-check-v0956.js
          node --check /tmp/core-v0956-built.js
          node build/v0956/campaign-check-v0956.js
          node build/v0956/patch-index-v0956.js
          test -s index.html
          test -s campaign-v095.css
          test -s neo-v0951.css
          test -s street-v0952.css
          test -s vigilante-v0953.css
          test -s results-v09531.css
          test -s sinister-v0954.css
          test -s smoke-v0955.css
          test -s goblin-v0956.css
          test -s collection-v0941.css
          test -s touch-v0941.css
          grep -q "Fight Arena v0.9.5.6 — Goblin Rework & Training Lab" index.html
          grep -q "THE GOBLIN<br>TAKES FLIGHT." index.html
          grep -q "goblin-v0956.css" index.html
          grep -q "campaign-v0956.js" index.html
          grep -q "core-v0956.js" index.html
          grep -q "transform-v0956.js" index.html
          grep -q "qa-v0956.js" index.html
          grep -q 'id="trainingSpecial"' index.html
          grep -q 'id="trainingReset"' index.html
          grep -q 'id="rematch"' index.html
          grep -q 'id="continue">NEXT FIGHT' index.html
          grep -q "version:'0.9.5.6'" /tmp/core-v0956-built.js
          grep -q "name:'Green Goblin'" /tmp/core-v0956-built.js
          grep -q "ARMORED GLIDER BOMBER" /tmp/core-v0956-built.js
          grep -q "goblinPumpkin" /tmp/core-v0956-built.js
          grep -q "goblinRazorBat" /tmp/core-v0956-built.js
          grep -q "goblinBombBarrage" /tmp/core-v0956-built.js
          grep -q "goblinGliderRush" /tmp/core-v0956-built.js
          grep -q "goblin-glider-rush" /tmp/core-v0956-built.js
          grep -q "cleanupTrainingArena" /tmp/core-v0956-built.js
          grep -q "resetTrainingLab" /tmp/core-v0956-built.js
          grep -q "fillTrainingSpecial" /tmp/core-v0956-built.js
          grep -q "FightArenaTrainingControls" /tmp/core-v0956-built.js
          grep -q "F.sp=100" /tmp/core-v0956-built.js
          grep -q "F.kinetic=100" /tmp/core-v0956-built.js
          grep -q "F.cooldowns=\[0,0,0\]" /tmp/core-v0956-built.js
          grep -q "F.busy=false" /tmp/core-v0956-built.js
          grep -q "punisherUnlockShown" /tmp/core-v0956-built.js
          grep -q "showPunisherUnlock" /tmp/core-v0956-built.js
          grep -q "rematch(){" /tmp/core-v0956-built.js
          grep -q "next(){" /tmp/core-v0956-built.js
          grep -q "screen('results')" /tmp/core-v0956-built.js
          grep -q "clearFightTouchLock" /tmp/core-v0956-built.js
          grep -q "name:'Mysterio'" /tmp/core-v0956-built.js
          grep -q "name:'Rhino'" /tmp/core-v0956-built.js
          grep -q "name:'Electro'" /tmp/core-v0956-built.js
          grep -q "name:'Ultron'" /tmp/core-v0956-built.js
          grep -q "name:'Prowler'" /tmp/core-v0956-built.js
          grep -q "code==='DIAMONDS'" /tmp/core-v0956-built.js
          grep -q "phase2Order=\['Rhino','Electro','Mysterio','Green Goblin'\]" campaign-v0956.js
          grep -q "AERIAL CHAOS" campaign-v0956.js
          grep -q "Glider Rush" campaign-v0956.js
          grep -q "FightArenaCampaignV0956" campaign-v0956.js
          grep -q "name:'Doctor Octopus'.*boss:true" campaign-v0954.js
          grep -q "STANDBY=\['Ultron','Prowler'\]" campaign-v0954.js
          grep -q ".fighter.greengoblin" goblin-v0956.css
          grep -q "ICONIC GOBLIN GLIDER" goblin-v0956.css
          grep -q "goblin-glider-rush" goblin-v0956.css
          grep -q "goblin-razorbat" goblin-v0956.css
          grep -q "#results.active" results-v09531.css
          grep -q "fighter-unlock-reveal" results-v09531.css
          grep -q "touchstart" touch-v0941.js
          grep -q "preventDefault" touch-v0941.js
          grep -q "multiTouch:true" touch-v0941.js
          grep -q "device-iphone" device-v092.css
          grep -q "KeyA" device-v092.js

      - name: Persist v0.9.5.6 release index
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Release Fight Arena v0.9.5.6 index [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
