name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.5.3 Vigilante Line
        run: |
          node --check build/v094/transform-v094.js
          node --check build/v0941/transform-v0941.js
          node --check build/v095/transform-v095.js
          node --check build/v0951/transform-v0951.js
          node --check build/v0952/transform-v0952.js
          node --check build/v0953/transform-v0953.js
          node --check build/v0953/build-check-v0953.js
          node --check build/v0953/patch-index-v0953.js
          node --check core-v0953.js
          node --check device-v092.js
          node --check touch-v0941.js
          node --check stability-v0941.js
          node --check campaign-v0953.js
          node --check qa-v0953.js
          node build/v0953/build-check-v0953.js
          node --check /tmp/core-v0953-built.js
          node build/v0953/patch-index-v0953.js
          test -s index.html
          test -s campaign-v095.css
          test -s neo-v0951.css
          test -s street-v0952.css
          test -s vigilante-v0953.css
          test -s collection-v0941.css
          test -s touch-v0941.css
          grep -q "v0.9.5.3" index.html
          grep -q "PHASE 1 • VIGILANTE LINE" index.html
          grep -q "vigilante-v0953.css" index.html
          grep -q 'id="rematch"' index.html
          grep -q "campaign-v0953.js" index.html
          grep -q "core-v0953.js" index.html
          grep -q "transform-v0953.js" index.html
          grep -q "version:'0.9.5.3'" /tmp/core-v0953-built.js
          grep -q "name:'Punisher'" /tmp/core-v0953-built.js
          grep -q "name:'Taskmaster'" /tmp/core-v0953-built.js
          grep -q "campaignOnly:true" /tmp/core-v0953-built.js
          grep -q "punisher-default" /tmp/core-v0953-built.js
          grep -q "VIGILANTE_INTROS" /tmp/core-v0953-built.js
          grep -q "introLocked" /tmp/core-v0953-built.js
          grep -q "punisherRifle" /tmp/core-v0953-built.js
          grep -q "punisherGrenade" /tmp/core-v0953-built.js
          grep -q "taskmasterShield" /tmp/core-v0953-built.js
          grep -q "taskmasterSword" /tmp/core-v0953-built.js
          grep -q "taskmasterMasterclass" /tmp/core-v0953-built.js
          grep -q "rematch(){" /tmp/core-v0953-built.js
          grep -q "FightArenaCampaignControls" /tmp/core-v0953-built.js
          grep -q "name:'Crossbones'" /tmp/core-v0953-built.js
          grep -q "name:'Bullseye'" /tmp/core-v0953-built.js
          grep -q "name:'Ultron'" /tmp/core-v0953-built.js
          grep -q "name:'Prowler'" /tmp/core-v0953-built.js
          grep -q "code==='DIAMONDS'" /tmp/core-v0953-built.js
          grep -q "fighter.punisher" vigilante-v0953.css
          grep -q "fighter.taskmaster" vigilante-v0953.css
          grep -q "punisher-warzonefx" vigilante-v0953.css
          grep -q "taskmaster-masterfx" vigilante-v0953.css
          grep -q "phase1Order" campaign-v0953.js
          grep -q "name:'Punisher'.*built:true.*PLAYABLE FIGHTER UNLOCK" campaign-v0953.js
          grep -q "name:'Taskmaster'.*built:true" campaign-v0953.js
          grep -q "name:'Kingpin'.*built:true.*boss:true" campaign-v0953.js
          grep -q "name:'Doctor Octopus'.*boss:true" campaign-v0953.js
          grep -q "STANDBY=\['Ultron','Prowler'\]" campaign-v0953.js
          grep -q "touchstart" touch-v0941.js
          grep -q "preventDefault" touch-v0941.js
          grep -q "multiTouch:true" touch-v0941.js
          grep -q "device-iphone" device-v092.css
          grep -q "KeyA" device-v092.js

      - name: Persist v0.9.5.3 release index
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Release Fight Arena v0.9.5.3 index [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
