name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.4.1 Combat Stability & Collection UI
        run: |
          node --check build/v094/transform-v094.js
          node --check build/v0941/transform-v0941.js
          node --check build/v0941/build-check-v0941.js
          node --check core-v0941.js
          node --check device-v092.js
          node --check touch-v0941.js
          node --check stability-v0941.js
          node --check qa-v0941.js
          node build/v0941/build-check-v0941.js
          node --check /tmp/core-v0941-built.js
          test -s index.html
          test -s heroes-v094.css
          test -s collection-v0941.css
          test -s touch-v0941.css
          grep -q "v0.9.4.1" index.html
          grep -q "COMBAT STABILITY & COLLECTION UI" index.html
          grep -q "collection-v0941.css" index.html
          grep -q "core-v0941.js" index.html
          grep -q "touch-v0941.js" index.html
          grep -q "stability-v0941.js" index.html
          grep -q "cleanupArenaTransient" /tmp/core-v0941-built.js
          grep -q "#mystClone" /tmp/core-v0941-built.js
          grep -q "fighterKitPanel" /tmp/core-v0941-built.js
          grep -q "skin-hero-group" /tmp/core-v0941-built.js
          grep -q "ABILITY VARIANT" /tmp/core-v0941-built.js
          grep -q "code==='DIAMONDS'" /tmp/core-v0941-built.js
          grep -q "save.gems+=100" /tmp/core-v0941-built.js
          grep -q "touchstart" touch-v0941.js
          grep -q "touchmove" touch-v0941.js
          grep -q "preventDefault" touch-v0941.js
          grep -q "multiTouch:true" touch-v0941.js
          grep -q "touch-action:none" touch-v0941.css
          grep -q "skin-hero-group" collection-v0941.css
          grep -q "fighter-kit-panel" collection-v0941.css
          grep -q "device-iphone" device-v092.css
          grep -q "KeyA" device-v092.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
