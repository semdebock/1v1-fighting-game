name: Deploy Fight Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate v0.9.2 device release
        run: |
          cat build/v091/core-v091-part1.txt build/v091/core-v091-part2.txt build/v091/core-v091-part3.txt build/v091/core-v091-part4.txt > /tmp/core-v091-full.js
          node --check /tmp/core-v091-full.js
          node --check core-v092.js
          node --check device-v092.js
          node --check qa-v092.js
          test -s index.html
          test -s core-v092.js
          test -s device-v092.js
          test -s device-v092.css
          test -s qa-v092.js
          test -s build/v090/cosmetics-v090.css
          grep -q "v0.9.2" index.html
          grep -q "deviceChooser" index.html
          grep -q "deviceModeBtn" index.html
          grep -q "core-v092.js" index.html
          grep -q "FightArenaControls" core-v092.js
          grep -q "KeyA" device-v092.js
          grep -q "device-iphone" device-v092.css
          grep -q "iPhone Portrait Mode" index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
